name: Build BLACK X Android APK

on:
  push:
    branches:
      - main
      - arena/ba9404bd-black-x-anime
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Optional default BLACK X Cloud Server URL (e.g. https://your-app.onrender.com)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish BLACK-X.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Client & Sync Capacitor Android
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.server_url || vars.VITE_API_BASE_URL || '' }}
        run: |
          npm run build
          npx cap sync android

      - name: Build Android APK (Gradle assembleDebug)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../BLACK-X.apk
          ls -lh ../BLACK-X.apk

      - name: Upload BLACK-X.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLACK-X-apk
          path: BLACK-X.apk
          if-no-files-found: error

      - name: Publish Latest APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "BLACK X Official Android APK (Latest)"
          body: |
            ### 📲 تطبيق BLACK X الرسمي للأندرويد (APK)
            - **ملف التثبيت المباشر:** `BLACK-X.apk`
            - يدعم سيرفرات الأنمي الثلاثية (`BLACK X 1` / `BLACK X 2` / `BLACK X 3`) مع الترجمة العربية الفورية.
            - يدعم سيرفرات المانجا والمانهوا الثلاثية (`BLACK X 1` / `BLACK X 2` / `BLACK X 3`) مع القارئ المباشر وتحميل الفصول.
            - مزود بنظام ربط سحابي مرن (`🌐 APK Server Settings`) من شريط التطبيق العلوي.
          files: BLACK-X.apk
          prerelease: false
          make_latest: true
